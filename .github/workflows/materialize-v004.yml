name: Materialize v0.0.4

on:
  push:
    branches:
      - release/v0.0.4-marketplace-ready
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v0.0.4-marketplace-ready
          fetch-depth: 0

      - name: Reconstruct v0.0.4 source files
        shell: bash
        run: |
          set -euo pipefail

          cp media/webview/pdf-engine.js /tmp/pdf-engine-v003.js

          decode_payload() {
            local source="$1"
            local target="$2"
            mkdir -p "$(dirname "$target")"
            base64 --decode "$source" | gzip --decompress > "$target"
          }

          decode_payload .v004/CHANGELOG.md.gz.b64 CHANGELOG.md
          decode_payload .v004/README.md.gz.b64 README.md
          decode_payload .v004/package.json.gz.b64 package.json
          decode_payload .v004/package-lock.json.gz.b64 package-lock.json
          decode_payload .v004/styles.css.gz.b64 media/webview/styles.css
          decode_payload .v004/pdf-engine.test.mjs.gz.b64 test/pdf-engine.test.mjs

          cat .v004/main.js.gz.b64.part* \
            | base64 --decode \
            | gzip --decompress \
            > media/webview/main.js

          python - <<'PY'
          import base64
          import difflib
          import glob
          import zlib
          from pathlib import Path

          encoded = ''.join(
              Path(path).read_text(encoding='utf-8').strip()
              for path in sorted(glob.glob('.v004/pdf-engine.js.gz.b64.part*'))
          )
          compressed = base64.b64decode(encoded)
          inflater = zlib.decompressobj(16 + zlib.MAX_WBITS)
          partial = inflater.decompress(compressed).decode('utf-8')
          old = Path('/tmp/pdf-engine-v003.js').read_text(encoding='utf-8')

          old_lines = old.splitlines(keepends=True)
          partial_lines = partial.splitlines(keepends=True)
          matcher = difflib.SequenceMatcher(None, old_lines, partial_lines, autojunk=False)
          blocks = matcher.get_matching_blocks()
          candidates = [
              block for block in blocks
              if block.size >= 5 and (len(partial_lines) - (block.b + block.size)) <= 120
          ]
          if not candidates:
              raise RuntimeError('Could not find a safe common line anchor near the truncated payload tail')

          anchor = max(candidates, key=lambda block: (block.b + block.size, block.size))
          trailing_partial = len(partial_lines) - (anchor.b + anchor.size)

          print(f'Old engine: {len(old)} chars / {len(old_lines)} lines')
          print(f'Partial v0.0.4: {len(partial)} chars / {len(partial_lines)} lines')
          print(f'Inflater reached gzip EOF: {inflater.eof}')
          print(
              'Recovery anchor: '
              f'old lines {anchor.a + 1}-{anchor.a + anchor.size} == '
              f'partial lines {anchor.b + 1}-{anchor.b + anchor.size}, '
              f'size={anchor.size}, trailing_partial_lines={trailing_partial}'
          )

          candidate = ''.join(partial_lines[:anchor.b]) + ''.join(old_lines[anchor.a:])
          Path('media/webview/pdf-engine.js').write_text(candidate, encoding='utf-8')

          diff = list(difflib.unified_diff(
              old.splitlines(),
              candidate.splitlines(),
              fromfile='pdf-engine-v0.0.3.js',
              tofile='pdf-engine-v0.0.4-recovered.js',
              n=2,
              lineterm='',
          ))
          print(f'Recovered engine: {len(candidate)} chars')
          print(f'Diff lines vs 0.0.3: {len(diff)}')
          print('\n'.join(diff[:240]))
          if len(diff) > 240:
              print(f'... diff truncated in log ({len(diff) - 240} more lines)')
          PY

      - name: Generate Marketplace icon
        shell: python
        run: |
          import os
          import struct
          import zlib

          width = height = 256
          red = (211, 47, 47, 255)
          white = (255, 255, 255, 255)
          pixels = [[red for _ in range(width)] for _ in range(height)]

          def rect(x1, y1, x2, y2, color):
              for y in range(max(0, y1), min(height, y2)):
                  for x in range(max(0, x1), min(width, x2)):
                      pixels[y][x] = color

          rect(55, 34, 181, 222, white)
          rect(181, 76, 202, 222, white)
          for y in range(34, 77):
              max_x = 181 + (y - 34) // 2
              rect(181, y, min(203, max_x + 1), y + 1, white)

          rect(82, 116, 176, 130, red)
          rect(82, 145, 176, 159, red)
          rect(82, 174, 157, 188, red)

          raw = bytearray()
          for row in pixels:
              raw.append(0)
              for rgba in row:
                  raw.extend(rgba)

          def chunk(kind, data):
              return (
                  struct.pack('>I', len(data))
                  + kind
                  + data
                  + struct.pack('>I', zlib.crc32(kind + data) & 0xffffffff)
              )

          png = bytearray(b'\x89PNG\r\n\x1a\n')
          png += chunk(b'IHDR', struct.pack('>IIBBBBB', width, height, 8, 6, 0, 0, 0))
          png += chunk(b'IDAT', zlib.compress(bytes(raw), 9))
          png += chunk(b'IEND', b'')

          os.makedirs('images', exist_ok=True)
          with open('images/icon.png', 'wb') as fh:
              fh.write(png)

      - name: Clean staging payload and harden package exclusions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .v004
          grep -qxF '.v004/**' .vscodeignore || printf '\n.v004/**\n' >> .vscodeignore
          grep -qxF '.v004/' .gitignore || printf '\n.v004/\n' >> .gitignore

          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (pkg.version !== '0.0.4') {
            throw new Error(`Expected package version 0.0.4, got ${pkg.version}`);
          }
          if (pkg.icon !== 'images/icon.png') {
            pkg.icon = 'images/icon.png';
            fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          }
          NODE

          test -s images/icon.png

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: npm run check

      - name: Package and verify VSIX
        shell: bash
        run: |
          set -euo pipefail
          npm run package
          test -f pdf-viewer-editor-0.0.4.vsix
          unzip -l pdf-viewer-editor-0.0.4.vsix > /tmp/vsix-files.txt
          grep -q 'extension/images/icon.png' /tmp/vsix-files.txt
          if grep -q 'extension/.v004/' /tmp/vsix-files.txt; then
            echo 'ERROR: .v004 payload leaked into VSIX' >&2
            exit 1
          fi
          rm -f pdf-viewer-editor-0.0.4.vsix

      - name: Commit release-ready source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/materialize-v004.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'release: prepare v0.0.4 for VS Code Marketplace'
          git push origin HEAD:release/v0.0.4-marketplace-ready
