name: Materialize v0.0.4

on:
  push:
    branches:
      - release/v0.0.4-marketplace-ready
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v0.0.4-marketplace-ready
          fetch-depth: 0

      - name: Reconstruct v0.0.4 source files
        shell: bash
        run: |
          set -euo pipefail

          cp media/webview/pdf-engine.js /tmp/pdf-engine-v003.js

          decode_payload() {
            local source="$1"
            local target="$2"
            mkdir -p "$(dirname "$target")"
            base64 --decode "$source" | gzip --decompress > "$target"
          }

          decode_payload .v004/CHANGELOG.md.gz.b64 CHANGELOG.md
          decode_payload .v004/README.md.gz.b64 README.md
          decode_payload .v004/package.json.gz.b64 package.json
          decode_payload .v004/package-lock.json.gz.b64 package-lock.json
          decode_payload .v004/styles.css.gz.b64 media/webview/styles.css
          decode_payload .v004/pdf-engine.test.mjs.gz.b64 test/pdf-engine.test.mjs

          cat .v004/main.js.gz.b64.part* \
            | base64 --decode \
            | gzip --decompress \
            > media/webview/main.js

          python - <<'PY'
          import base64
          import difflib
          import glob
          import zlib
          from pathlib import Path

          encoded = ''.join(
              Path(path).read_text(encoding='utf-8').strip()
              for path in sorted(glob.glob('.v004/pdf-engine.js.gz.b64.part*'))
          )
          compressed = base64.b64decode(encoded)
          inflater = zlib.decompressobj(16 + zlib.MAX_WBITS)
          partial = inflater.decompress(compressed).decode('utf-8')
          old = Path('/tmp/pdf-engine-v003.js').read_text(encoding='utf-8')

          old_lines = old.splitlines(keepends=True)
          partial_lines = partial.splitlines(keepends=True)
          matcher = difflib.SequenceMatcher(None, old_lines, partial_lines, autojunk=False)
          blocks = matcher.get_matching_blocks()
          candidates = [
              block for block in blocks
              if block.size >= 5 and (len(partial_lines) - (block.b + block.size)) <= 120
          ]
          if not candidates:
              raise RuntimeError('Could not find a safe common line anchor near the truncated payload tail')

          anchor = max(candidates, key=lambda block: (block.b + block.size, block.size))
          trailing_partial = len(partial_lines) - (anchor.b + anchor.size)
          candidate = ''.join(partial_lines[:anchor.b]) + ''.join(old_lines[anchor.a:])

          print(f'Old engine: {len(old)} chars / {len(old_lines)} lines')
          print(f'Partial v0.0.4: {len(partial)} chars / {len(partial_lines)} lines')
          print(f'Inflater reached gzip EOF: {inflater.eof}')
          print(
              'Recovery anchor: '
              f'old lines {anchor.a + 1}-{anchor.a + anchor.size} == '
              f'partial lines {anchor.b + 1}-{anchor.b + anchor.size}, '
              f'size={anchor.size}, trailing_partial_lines={trailing_partial}'
          )

          # v0.0.4 expects visual rows to retain their original fragments so it can
          # map mouse selections back to exact character ranges.
          visual_return = """    return {\n      text,\n      rect: row.rect,"""
          visual_return_with_fragments = """    return {\n      text,\n      fragments: row.fragments,\n      rect: row.rect,"""
          if visual_return in candidate and visual_return_with_fragments not in candidate:
              candidate = candidate.replace(
                  visual_return,
                  visual_return_with_fragments,
                  1
              )

          helpers = r'''
function splitVisualLinesIntoParagraphs(visualLines) {
  if (!Array.isArray(visualLines) || visualLines.length === 0) {
    return [];
  }
  if (visualLines.length === 1) {
    return [[visualLines[0]]];
  }

  const lines = [...visualLines].sort((left, right) => {
    const yDifference = left.baseline[1] - right.baseline[1];
    return Math.abs(yDifference) > 0.75
      ? yDifference
      : left.rect[0] - right.rect[0];
  });
  const paragraphs = [];
  let paragraph = [lines[0]];

  for (const line of lines.slice(1)) {
    const previous = paragraph.at(-1);
    const previousHeight = Math.max(1, previous.rect[3] - previous.rect[1]);
    const currentHeight = Math.max(1, line.rect[3] - line.rect[1]);
    const fontSize = Math.max(
      1,
      Number(previous.font?.size || 0),
      Number(line.font?.size || 0)
    );
    const verticalGap = line.rect[1] - previous.rect[3];
    const baselineGap = line.baseline[1] - previous.baseline[1];
    const expectedLineHeight = Math.max(previousHeight, currentHeight, fontSize * 1.05);
    const paragraphGap = Math.max(3, fontSize * 0.55);
    const startsNewParagraph =
      verticalGap > paragraphGap ||
      baselineGap > expectedLineHeight * 1.75;

    if (startsNewParagraph) {
      paragraphs.push(paragraph);
      paragraph = [line];
    } else {
      paragraph.push(line);
    }
  }

  paragraphs.push(paragraph);
  return paragraphs;
}

function decorateParagraphLines(paragraphLines, blockIndex) {
  let text = '';
  const lines = [];

  for (const sourceLine of paragraphLines) {
    const lineText = String(sourceLine.text || '').trim();
    if (!lineText) {
      continue;
    }
    const separator = text ? ' ' : '';
    const start = text.length + separator.length;
    text += separator + lineText;
    const end = text.length;
    const lineIndex = lines.length;
    lines.push({
      ...sourceLine,
      text: lineText,
      blockIndex,
      lineIndex,
      start,
      end,
      startOffset: start,
      endOffset: end,
      textStart: start,
      textEnd: end
    });
  }

  return { text, lines };
}

function layoutRichTextBlock(rect, runs, metrics, alignment = 0) {
  const normalizedRuns = (Array.isArray(runs) ? runs : [])
    .map((run) => ({
      text: String(run?.text || '').replaceAll('\r\n', '\n').replaceAll('\r', '\n'),
      values: run?.values || {}
    }))
    .filter((run) => run.text.length > 0);

  if (normalizedRuns.length === 0) {
    return { height: 0, entries: [], lines: [] };
  }

  const width = Math.max(24, rect[2] - rect[0]);
  const fonts = new Map();
  const getFont = (fontName) => {
    const name = String(fontName || 'Helvetica');
    if (!fonts.has(name)) {
      fonts.set(name, new mupdf.Font(name));
    }
    return fonts.get(name);
  };
  const itemWidth = (item) => measureText(
    getFont(item.values.fontName),
    item.character,
    Math.max(4, Number(item.values.fontSize || 12))
  );
  const lineWidth = (items) => items.reduce((sum, item) => sum + itemWidth(item), 0);
  const trimLine = (items) => {
    let start = 0;
    let end = items.length;
    while (start < end && /\s/u.test(items[start].character)) {
      start += 1;
    }
    while (end > start && /\s/u.test(items[end - 1].character)) {
      end -= 1;
    }
    return items.slice(start, end);
  };

  try {
    const items = [];
    for (const run of normalizedRuns) {
      for (const character of run.text) {
        items.push({ character, values: run.values });
      }
    }

    const wrappedLines = [];
    let current = [];
    let currentWidth = 0;

    const commitLine = (lineItems) => {
      wrappedLines.push(trimLine(lineItems));
    };

    for (const item of items) {
      if (item.character === '\n') {
        commitLine(current);
        current = [];
        currentWidth = 0;
        continue;
      }

      const widthToAdd = itemWidth(item);
      if (current.length > 0 && currentWidth + widthToAdd > width + 0.5) {
        let breakAt = -1;
        for (let index = current.length - 1; index >= 0; index -= 1) {
          if (/\s/u.test(current[index].character)) {
            breakAt = index;
            break;
          }
        }

        if (breakAt >= 0) {
          const carry = current.slice(breakAt + 1);
          commitLine(current.slice(0, breakAt));
          current = carry;
          currentWidth = lineWidth(current);
        } else {
          commitLine(current);
          current = [];
          currentWidth = 0;
        }
      }

      if (/\s/u.test(item.character) && current.length === 0) {
        continue;
      }
      current.push(item);
      currentWidth += widthToAdd;
    }
    commitLine(current);

    const maximumFontSize = Math.max(
      4,
      ...normalizedRuns.map((run) => Math.max(4, Number(run.values.fontSize || 12)))
    );
    const baselineOffset = clampNumber(
      Number(metrics?.baselineOffsetRatio || 1.05) * maximumFontSize,
      maximumFontSize * 0.75,
      maximumFontSize * 1.5
    );
    const lineHeight = clampNumber(
      Number(metrics?.lineHeightRatio || 1.25) * maximumFontSize,
      maximumFontSize,
      maximumFontSize * 2
    );
    const descent = clampNumber(
      Number(metrics?.descentRatio || 0.25) * maximumFontSize,
      maximumFontSize * 0.12,
      maximumFontSize * 0.6
    );
    const height = baselineOffset + Math.max(0, wrappedLines.length - 1) * lineHeight + descent;
    const entries = [];

    wrappedLines.forEach((lineItems, lineIndex) => {
      const measuredWidth = lineWidth(lineItems);
      let x = rect[0];
      if (alignment === 1) {
        x = rect[0] + (width - measuredWidth) / 2;
      } else if (alignment === 2) {
        x = rect[2] - measuredWidth;
      }
      const baselineY = rect[1] + baselineOffset + lineIndex * lineHeight;
      let segment = [];
      let segmentKey = null;

      const flushSegment = () => {
        if (segment.length === 0) {
          return;
        }
        const values = segment[0].values;
        const text = segment.map((entry) => entry.character).join('');
        if (text) {
          entries.push({
            text,
            baseline: [x, baselineY],
            fontName: values.fontName || 'Helvetica',
            fontSize: Math.max(4, Number(values.fontSize || 12)),
            color: normalizeColor(values.color, [0, 0, 0])
          });
          x += measureText(
            getFont(values.fontName),
            text,
            Math.max(4, Number(values.fontSize || 12))
          );
        }
        segment = [];
        segmentKey = null;
      };

      for (const entry of lineItems) {
        const values = entry.values;
        const key = JSON.stringify([
          values.fontName || 'Helvetica',
          Math.max(4, Number(values.fontSize || 12)),
          normalizeColor(values.color, [0, 0, 0])
        ]);
        if (segmentKey !== null && key !== segmentKey) {
          flushSegment();
        }
        segmentKey = key;
        segment.push(entry);
      }
      flushSegment();
    });

    return {
      height,
      entries,
      lines: wrappedLines.map((line) => line.map((item) => item.character).join(''))
    };
  } finally {
    destroyAll(fonts.values());
  }
}
'''

          marker = 'function layoutTextBlock(rect, values, metrics, originalBlock = null) {'
          if marker not in candidate:
              raise RuntimeError('Could not locate layoutTextBlock insertion point')
          if 'function layoutRichTextBlock(' not in candidate:
              candidate = candidate.replace(marker, helpers + '\n' + marker, 1)

          Path('media/webview/pdf-engine.js').write_text(candidate, encoding='utf-8')

          diff = list(difflib.unified_diff(
              old.splitlines(),
              candidate.splitlines(),
              fromfile='pdf-engine-v0.0.3.js',
              tofile='pdf-engine-v0.0.4-recovered.js',
              n=2,
              lineterm='',
          ))
          print(f'Recovered engine: {len(candidate)} chars')
          print(f'Diff lines vs 0.0.3: {len(diff)}')
          print('\n'.join(diff[:260]))
          if len(diff) > 260:
              print(f'... diff truncated in log ({len(diff) - 260} more lines)')
          PY

          echo '--- Selection offset references in reconstructed main.js ---'
          grep -nE 'startOffset|endOffset|textStart|textEnd|line\.(start|end)|selection(Start|End)|range(Start|End)' media/webview/main.js | head -80 || true
          echo '--- Relevant v0.0.4 test names ---'
          grep -nE 'test\(|paragraph|selection|editTextRange|insertImageBlock|insertTableBlock|visualLines' test/pdf-engine.test.mjs | head -120 || true

      - name: Generate Marketplace icon
        shell: python
        run: |
          import os
          import struct
          import zlib

          width = height = 256
          red = (211, 47, 47, 255)
          white = (255, 255, 255, 255)
          pixels = [[red for _ in range(width)] for _ in range(height)]

          def rect(x1, y1, x2, y2, color):
              for y in range(max(0, y1), min(height, y2)):
                  for x in range(max(0, x1), min(width, x2)):
                      pixels[y][x] = color

          rect(55, 34, 181, 222, white)
          rect(181, 76, 202, 222, white)
          for y in range(34, 77):
              max_x = 181 + (y - 34) // 2
              rect(181, y, min(203, max_x + 1), y + 1, white)

          rect(82, 116, 176, 130, red)
          rect(82, 145, 176, 159, red)
          rect(82, 174, 157, 188, red)

          raw = bytearray()
          for row in pixels:
              raw.append(0)
              for rgba in row:
                  raw.extend(rgba)

          def chunk(kind, data):
              return (
                  struct.pack('>I', len(data))
                  + kind
                  + data
                  + struct.pack('>I', zlib.crc32(kind + data) & 0xffffffff)
              )

          png = bytearray(b'\x89PNG\r\n\x1a\n')
          png += chunk(b'IHDR', struct.pack('>IIBBBBB', width, height, 8, 6, 0, 0, 0))
          png += chunk(b'IDAT', zlib.compress(bytes(raw), 9))
          png += chunk(b'IEND', b'')

          os.makedirs('images', exist_ok=True)
          with open('images/icon.png', 'wb') as fh:
              fh.write(png)

      - name: Clean staging payload and harden package exclusions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .v004
          grep -qxF '.v004/**' .vscodeignore || printf '\n.v004/**\n' >> .vscodeignore
          grep -qxF '.v004/' .gitignore || printf '\n.v004/\n' >> .gitignore

          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (pkg.version !== '0.0.4') {
            throw new Error(`Expected package version 0.0.4, got ${pkg.version}`);
          }
          if (pkg.icon !== 'images/icon.png') {
            pkg.icon = 'images/icon.png';
            fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          }
          NODE

          test -s images/icon.png

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: npm run check

      - name: Package and verify VSIX
        shell: bash
        run: |
          set -euo pipefail
          npm run package
          test -f pdf-viewer-editor-0.0.4.vsix
          unzip -l pdf-viewer-editor-0.0.4.vsix > /tmp/vsix-files.txt
          grep -q 'extension/images/icon.png' /tmp/vsix-files.txt
          if grep -q 'extension/.v004/' /tmp/vsix-files.txt; then
            echo 'ERROR: .v004 payload leaked into VSIX' >&2
            exit 1
          fi
          rm -f pdf-viewer-editor-0.0.4.vsix

      - name: Commit release-ready source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/materialize-v004.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'release: prepare v0.0.4 for VS Code Marketplace'
          git push origin HEAD:release/v0.0.4-marketplace-ready
