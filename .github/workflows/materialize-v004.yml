name: Materialize v0.0.4

on:
  push:
    branches:
      - release/v0.0.4-marketplace-ready

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.0.4-marketplace-ready
          fetch-depth: 0

      - name: Reconstruct v0.0.4
        shell: bash
        run: |
          set -euo pipefail
          cp media/webview/pdf-engine.js /tmp/pdf-engine-v003.js

          decode_payload() {
            mkdir -p "$(dirname "$2")"
            base64 --decode "$1" | gzip --decompress > "$2"
          }

          decode_payload .v004/CHANGELOG.md.gz.b64 CHANGELOG.md
          decode_payload .v004/README.md.gz.b64 README.md
          decode_payload .v004/package.json.gz.b64 package.json
          decode_payload .v004/package-lock.json.gz.b64 package-lock.json
          decode_payload .v004/styles.css.gz.b64 media/webview/styles.css
          decode_payload .v004/pdf-engine.test.mjs.gz.b64 test/pdf-engine.test.mjs
          cat .v004/main.js.gz.b64.part* | base64 --decode | gzip --decompress > media/webview/main.js

          python - <<'PY'
          import base64
          import difflib
          import glob
          import zlib
          from pathlib import Path

          encoded = ''.join(Path(p).read_text().strip() for p in sorted(glob.glob('.v004/pdf-engine.js.gz.b64.part*')))
          inflater = zlib.decompressobj(16 + zlib.MAX_WBITS)
          partial = inflater.decompress(base64.b64decode(encoded)).decode('utf-8')
          old = Path('/tmp/pdf-engine-v003.js').read_text(encoding='utf-8')
          old_lines = old.splitlines(keepends=True)
          partial_lines = partial.splitlines(keepends=True)
          blocks = difflib.SequenceMatcher(None, old_lines, partial_lines, autojunk=False).get_matching_blocks()
          candidates = [b for b in blocks if b.size >= 5 and len(partial_lines) - (b.b + b.size) <= 120]
          if not candidates:
              raise RuntimeError('No safe recovery anchor found for truncated v0.0.4 engine')
          anchor = max(candidates, key=lambda b: (b.b + b.size, b.size))
          candidate = ''.join(partial_lines[:anchor.b]) + ''.join(old_lines[anchor.a:])

          old_return = "    return {\n      text,\n      rect: row.rect,"
          new_return = "    return {\n      text,\n      fragments: row.fragments,\n      rect: row.rect,"
          if old_return in candidate and new_return not in candidate:
              candidate = candidate.replace(old_return, new_return, 1)

          helpers = base64.b64decode('').decode('utf-8')
          marker = 'function layoutTextBlock(rect, values, metrics, originalBlock = null) {'
          if marker not in candidate:
              raise RuntimeError('layoutTextBlock insertion point not found')
          if 'function layoutRichTextBlock(' not in candidate:
              candidate = candidate.replace(marker, helpers + '\n' + marker, 1)
          Path('media/webview/pdf-engine.js').write_text(candidate, encoding='utf-8')

          print(f'Partial v0.0.4: {len(partial)} chars; recovered engine: {len(candidate)} chars; gzip EOF={inflater.eof}')
          print(f'Recovery anchor old={anchor.a + 1}, staged={anchor.b + 1}, size={anchor.size}')
          PY

          echo 'Selection references:'
          grep -nE 'startOffset|endOffset|textStart|textEnd|line\.(start|end)' media/webview/main.js | head -80 || true
          echo 'v0.0.4 tests:'
          grep -nE 'test\(|paragraph|selection|editTextRange|insertImageBlock|insertTableBlock' test/pdf-engine.test.mjs | head -100 || true

      - name: Generate icon and clean staging payload
        shell: python
        run: |
          import os, struct, zlib
          width = height = 256
          red = (211, 47, 47, 255)
          white = (255, 255, 255, 255)
          pixels = [[red for _ in range(width)] for _ in range(height)]
          def rect(x1, y1, x2, y2, color):
              for y in range(y1, y2):
                  for x in range(x1, x2):
                      pixels[y][x] = color
          rect(55, 34, 181, 222, white)
          rect(181, 76, 202, 222, white)
          for y in range(34, 77):
              rect(181, y, min(203, 182 + (y - 34) // 2), y + 1, white)
          rect(82, 116, 176, 130, red)
          rect(82, 145, 176, 159, red)
          rect(82, 174, 157, 188, red)
          raw = bytearray()
          for row in pixels:
              raw.append(0)
              for rgba in row:
                  raw.extend(rgba)
          def chunk(kind, data):
              return struct.pack('>I', len(data)) + kind + data + struct.pack('>I', zlib.crc32(kind + data) & 0xffffffff)
          png = bytearray(b'\x89PNG\r\n\x1a\n')
          png += chunk(b'IHDR', struct.pack('>IIBBBBB', width, height, 8, 6, 0, 0, 0))
          png += chunk(b'IDAT', zlib.compress(bytes(raw), 9))
          png += chunk(b'IEND', b'')
          os.makedirs('images', exist_ok=True)
          open('images/icon.png', 'wb').write(png)

      - name: Clean and verify metadata
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .v004
          grep -qxF '.v004/**' .vscodeignore || printf '\n.v004/**\n' >> .vscodeignore
          grep -qxF '.v004/' .gitignore || printf '\n.v004/\n' >> .gitignore
          node -e "const p=require('./package.json'); if(p.version!=='0.0.4'||p.icon!=='images/icon.png') process.exit(1)"
          test -s images/icon.png

      - name: Install and verify
        run: |
          npm ci
          npm run check

      - name: Package and inspect VSIX
        shell: bash
        run: |
          set -euo pipefail
          npm run package
          test -f pdf-viewer-editor-0.0.4.vsix
          unzip -l pdf-viewer-editor-0.0.4.vsix > /tmp/vsix.txt
          grep -q 'extension/images/icon.png' /tmp/vsix.txt
          ! grep -q 'extension/.v004/' /tmp/vsix.txt
          rm pdf-viewer-editor-0.0.4.vsix

      - name: Commit release-ready source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/materialize-v004.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: prepare v0.0.4 for VS Code Marketplace'
          git push origin HEAD:release/v0.0.4-marketplace-ready
