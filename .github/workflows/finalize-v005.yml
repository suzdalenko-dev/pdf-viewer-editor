name: Finalize v0.0.5

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.0.5-finalize-extension-v2
          fetch-depth: 0

      - name: Final UI and Marketplace adjustments
        shell: python
        run: |
          from pathlib import Path
          import struct, zlib

          def replace_once(text, old, new, label):
              if old not in text:
                  raise RuntimeError(f'Missing {label}')
              return text.replace(old, new, 1)

          main_path = Path('media/webview/main.js')
          main = main_path.read_text()
          if 'event.detail >= 2' not in main:
              main = replace_once(
                  main,
                  "  hideInsertMenu();\n  const line = event.currentTarget;",
                  "  hideInsertMenu();\n  if (event.detail >= 2) {\n    window.requestAnimationFrame(updateTextRangeFromSelection);\n    return;\n  }\n  const line = event.currentTarget;",
                  'double click word selection'
              )
          main_path.write_text(main)

          html_path = Path('src/webview-html.js')
          html = html_path.read_text()
          html = html.replace('<option value="1">100%</option>', '<option value="1" selected>100%</option>', 1)
          html = html.replace('<option value="1.25" selected>125%</option>', '<option value="1.25">125%</option>', 1)
          html_path.write_text(html)

          width = height = 256
          bg = (229, 57, 53, 255)
          white = (255, 255, 255, 255)
          dark = (32, 33, 36, 255)
          pixels = [[bg for _ in range(width)] for _ in range(height)]

          def rect(x1, y1, x2, y2, color):
              for y in range(y1, y2):
                  for x in range(x1, x2):
                      if 0 <= x < width and 0 <= y < height:
                          pixels[y][x] = color

          rect(52, 30, 184, 226, white)
          rect(184, 78, 205, 226, white)
          for y in range(30, 79):
              rect(184, y, min(206, 185 + (y - 30) // 2), y + 1, white)
          rect(80, 105, 174, 119, bg)
          rect(80, 137, 174, 151, bg)
          rect(80, 169, 151, 183, bg)
          for i in range(52):
              for t in range(10):
                  x = 151 + i - t // 2
                  y = 202 - i + t
                  if 0 <= x < width and 0 <= y < height:
                      pixels[y][x] = dark

          raw = bytearray()
          for row in pixels:
              raw.append(0)
              for rgba in row:
                  raw.extend(rgba)

          def chunk(kind, data):
              return struct.pack('>I', len(data)) + kind + data + struct.pack('>I', zlib.crc32(kind + data) & 0xffffffff)

          png = bytearray(b'\x89PNG\r\n\x1a\n')
          png += chunk(b'IHDR', struct.pack('>IIBBBBB', width, height, 8, 6, 0, 0, 0))
          png += chunk(b'IDAT', zlib.compress(bytes(raw), 9))
          png += chunk(b'IEND', b'')
          Path('images/icon.png').write_bytes(png)

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text()
          if '## 0.0.5 - 2026-08-24' not in changelog:
              marker = 'Todos los cambios relevantes de este proyecto se documentan aquí.\n'
              section = '''\n## 0.0.5 - 2026-08-24\n\n### Corregido\n\n- Selección nativa exacta de líneas, palabras y frases sin rectángulo azul de párrafo.\n- Zoom inicial al 100%.\n- Botón Guardar escribe el PDF abierto y muestra confirmación visual.\n- Icono 256×256 renovado y validado como asset del VSIX/Marketplace.\n\n'''
              changelog = replace_once(changelog, marker, marker + section, 'changelog marker')
          changelog_path.write_text(changelog)

          readme_path = Path('README.md')
          readme = readme_path.read_text()
          readme = readme.replace('La versión `0.0.4`', 'La versión `0.0.5`', 1)
          readme = readme.replace('- Hacer clic sobre cualquier línea para seleccionar solo su párrafo visual, sin rectángulos gigantes.', '- Hacer clic sobre una línea selecciona solo esa línea; arrastrar selecciona exactamente palabras o frases, sin rectángulos gigantes.', 1)
          readme_path.write_text(readme)

      - name: Verify source and VSIX
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check
          npm run package
          test -f pdf-viewer-editor-0.0.5.vsix
          grep -q "event.detail >= 2" media/webview/main.js
          grep -q "range.selectNodeContents(line)" media/webview/main.js
          ! grep -q "classList.toggle('selected', Number(line.dataset.blockIndex)" media/webview/main.js
          grep -q "workspace.fs.writeFile(document.uri, document.data)" src/pdf-editor-provider.js
          grep -q "type: 'document-saved'" src/pdf-editor-provider.js
          grep -q '<option value="1" selected>100%</option>' src/webview-html.js
          node -e "const p=require('./package.json'); if(p.version!=='0.0.5'||p.icon!=='images/icon.png'||p.contributes.configuration.properties['pdfViewerEditor.defaultZoom'].default!==1) process.exit(1)"
          python - <<'PY'
          import struct, zipfile
          with zipfile.ZipFile('pdf-viewer-editor-0.0.5.vsix') as z:
              manifest = z.read('extension.vsixmanifest').decode()
              assert 'Version="0.0.5" Publisher="suzdalenko-dev"' in manifest
              assert '<Icon>extension/images/icon.png</Icon>' in manifest
              icon = z.read('extension/images/icon.png')
              assert icon[:8] == b'\x89PNG\r\n\x1a\n'
              assert struct.unpack('>II', icon[16:24]) == (256, 256)
              print('v0.0.5 VSIX verified with Marketplace icon')
          PY
          rm -f pdf-viewer-editor-0.0.5.vsix

      - name: Commit final branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalize-v005.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: complete v0.0.5 selection save zoom and marketplace icon'
          git push origin HEAD:fix/v0.0.5-finalize-extension-v2
