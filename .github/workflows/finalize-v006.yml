name: Finalize v0.0.6

on:
  push:
    branches:
      - fix/v0.0.6-geometry-resize
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.0.6-geometry-resize
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply v0.0.6 fixes
        run: python scripts/apply-v006-fixes.py

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: npm run check

      - name: Package and inspect VSIX
        shell: bash
        run: |
          set -euo pipefail
          npm run package
          test -f pdf-viewer-editor-0.0.6.vsix
          unzip -l pdf-viewer-editor-0.0.6.vsix > /tmp/vsix.txt
          grep -q 'extension/images/icon.png' /tmp/vsix.txt
          grep -q 'extension/media/webview/main.js' /tmp/vsix.txt
          grep -q 'extension/media/webview/pdf-engine.js' /tmp/vsix.txt
          ! grep -q 'apply-v006-fixes' /tmp/vsix.txt
          node -e "const p=require('./package.json'); if(p.version!=='0.0.6'||p.icon!=='images/icon.png') process.exit(1)"

      - name: Commit final source
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/apply-v006-fixes.js scripts/apply-v006-fixes.py .github/workflows/finalize-v006.yml pdf-viewer-editor-0.0.6.vsix
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: release v0.0.6 geometry and resizable text blocks'
          git push origin HEAD:fix/v0.0.6-geometry-resize
