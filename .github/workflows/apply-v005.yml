name: Apply v0.0.5 fixes

on:
  push:
    branches:
      - fix/v0.0.5-finalize-extension-v2
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.0.5-finalize-extension-v2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply fixes
        run: node scripts/apply-v005-fixes.js

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: npm run check

      - name: Package VSIX
        run: npm run package

      - name: Inspect package
        shell: bash
        run: |
          set -euo pipefail
          test -f pdf-viewer-editor-0.0.5.vsix
          unzip -l pdf-viewer-editor-0.0.5.vsix > /tmp/vsix.txt
          grep -q 'extension/images/icon.png' /tmp/vsix.txt
          grep -q 'extension/media/webview/main.js' /tmp/vsix.txt
          ! grep -q 'apply-v005-fixes.js' /tmp/vsix.txt

      - name: Commit final source
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/apply-v005-fixes.js .github/workflows/apply-v005.yml pdf-viewer-editor-0.0.5.vsix
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: finalize v0.0.5 selection save and marketplace UX'
          git push origin HEAD:fix/v0.0.5-finalize-extension-v2
